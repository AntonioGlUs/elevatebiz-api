[project]
name = "elevatebiz-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "EDGAR_GONZALEZ", email = "antoniomx1e@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.1",
    "langchain-openai>=1.6.7",
    "pydantic[email]>=2.13.5",
    "pymongo>=4.18.2",
    "python-dotenv>=1.2.3",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
elevatebiz-api = "elevatebiz_api:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
